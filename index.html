<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<!-- Source language is English; texts are translated at runtime from js/locales/. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Immich Stacks</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="page-header">
      <div class="title-row">
        <h1 id="app-title">Immich Stacks</h1>
        <label class="language-picker">
          <span id="label-language">Language</span>
          <select id="language"></select>
        </label>
      </div>
      <p id="app-hint" class="hint">
        Shows all stacks of your Immich server. Images are never deleted – only stacks or the
        assignment of an image to a stack.
      </p>
    </header>

    <form id="connection-form" class="connection-form" autocomplete="off">
      <label>
        <span id="label-server">Immich server</span>
        <input id="server-url" type="url" placeholder="https://immich.example.org" required />
      </label>
      <label>
        <span id="label-auth">Authentication</span>
        <select id="auth-type">
          <option id="option-auth-api-key" value="apiKey">API key (x-api-key)</option>
          <option id="option-auth-bearer" value="bearer">Access token (Bearer)</option>
        </select>
      </label>
      <label>
        <span id="label-token">Access token / API key</span>
        <input id="token" type="password" required />
      </label>
      <button id="load-button" class="button button--primary" type="submit">Load stacks</button>
    </form>

    <div class="toolbar">
      <input id="filter" type="search" placeholder="Filter by file name, path, album or tag" />
      <label class="checkbox">
        <input id="filter-single-image" type="checkbox" />
        <span id="label-filter-single-image">Only stacks with a single image</span>
      </label>
      <span id="summary" class="summary"></span>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <main id="stack-list" class="stack-list"></main>

    <script src="js/config.js"></script>
    <script src="js/locales/en.js"></script>
    <script src="js/locales/de.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/format.js"></script>
    <script src="js/api.js"></script>
    <script src="js/model.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
